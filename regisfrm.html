<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฟอร์มลงทะเบียนรับการแจ้งเตือน</title>

    <!-- bootstrap -->
    <link href="./vender/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <script src="./vender/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Sweetalert -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.3.6/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.3.6/dist/sweetalert2.all.min.js"></script>

    <style>
        html,
        body {
            background-image: linear-gradient(rgb(0, 132, 255), rgb(126, 161, 201), rgb(174, 174, 175));
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        .blink-text {
            animation: blinker 1s linear infinite;
            /* ปรับความเร็ว 1s (1 วินาที), linear (ความเร็วคงที่), infinite (กระพริบไม่รู้จบ) */
        }

        @keyframes blinker {
            50% {
                opacity: 0;
                /* ช่วงกลางของเวลา ข้อความจะหายไป (0%) */
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="card mt-2">
            <div class="card-body bg-light">
                <h5 class="card-title">ระบบแจ้งเตือนใบอนุญาต</h5>
                <!-- <p class="card-text">สำนักงานสรรพสามิตพื้นที่จันทบุรี สาขาเมือง</p> -->
            </div>
        </div>

        <div id='regfrm' class='card my-2' style='display: none;'>
            <div class='card-body bg-light g-3'>
                <table class="table table-striped table-hover">
                    <tbody>
                        <tr>
                            <th style='width: 80px;'>ชื่อ-สกุล</th>
                            <td><input type="text" class="form-control" id="frmname" placeholder="ชื่อ-สกุล......" />
                            </td>
                        </tr>
                        <tr>
                            <th>โทรศัพท์</th>
                            <td><input type="text" class="form-control" id="frmtel"
                                    placeholder="หมายเลขโทรศัพท์......" />
                            </td>
                        </tr>
                        <tr>
                            <td colspan='2'>
                                <a class="btn btn-success form-control" onclick="savereg()">ลงทะเบียน</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id='regdetail' class='card my-2' style='display: none;'>
            <div class='card-body bg-light'>

                <div class="alert alert-success" role="alert">มีข้อมูลการลงทะเบียนของท่านแล้ว</div>

                <table class="table table-striped table-hover">
                    <tbody>
                        <tr>
                            <th style='width: 80px;'>ชื่อ-สกุล</th>
                            <td id="regname"></td>
                        </tr>
                        <tr>
                            <th>โทรศัพท์</th>
                            <td id="regtel"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- loadingModal -->
    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="loadingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <!-- <div class="modal-header">
                    <h1 class="modal-title fs-5" id="loadingModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div> -->
                <div class="modal-body">
                    <div class="ratio ratio-1x1" style="width: 100%;">
                        <div class="spinner-border text-info" style="width: 100%; height: 100%;" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <h2 class="text-center text-info blink-text">Loading.....</h2>
                </div>
                <!-- <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Understood</button>
                </div> -->
            </div>
        </div>
    </div>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.21.4/sdk.js"></script>
    <script>
        var userId = "A001";
        var apiURL = "https://script.google.com/macros/s/AKfycbyk2_ZbDzA-gCiJlN4o_18qDcKMyCPWSStBFvUGfImihUFayHY97XIhbf-elKFQxMlMEA/exec";
        const loadingModal = new bootstrap.Modal('#loadingModal', {});

        function getreg() {
            let raw = {
                "userId": userId,
            };

            let options = {
                method: "POST",
                redirect: "follow",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(raw)
            };

            fetch(apiURL + '?fn=getreg', options)
                .then((response) => response.json())
                .then((result) => {
                    if (result.length > 0) {
                        let data = result[0];
                        document.getElementById('regfrm').style.display = "none";
                        document.getElementById('regdetail').style.display = "block";
                        document.getElementById('regname').innerHTML = data.regname;
                        document.getElementById('regtel').innerHTML = data.regtel;
                    } else {
                        document.getElementById('regfrm').style.display = "block";
                        document.getElementById('regdetail').style.display = "none";
                    }
                    loadingModal.hide();
                })
                .catch((error) => {
                    Swal.fire({
                        title: "Error",
                        text: "ดำเนินการผิดพลาด กรุณาลองใหม่อีกครั้ง",
                        icon: "error"
                    }).then(() => {
                        loadingModal.hide();
                    });
                    console.log(error);
                });
        }

        function savereg() {
            let frmname = document.getElementById('frmname').value;
            let frmtel = document.getElementById('frmtel').value;

            loadingModal.show();

            if (frmname == "" || frmtel == "") {
                Swal.fire({
                    title: "Warning",
                    text: "กรุณากรอกข้อมูลให้ครบถ้วน",
                    icon: "warning"
                }).then(() => {
                    window.scrollTo({
                        top: 0,
                        left: 0,
                        behavior: 'smooth'
                    });
                    loadingModal.hide();
                });
            } else {

                let raw = {
                    "userId": userId,
                    "frmname": frmname,
                    "frmtel": frmtel
                };

                let options = {
                    method: "POST",
                    redirect: "follow",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(raw)
                };


                fetch(apiURL + '?fn=savereg', options)
                    .then((response) => response.json())
                    .then((result) => {
                        if (result.res) {
                            liff.sendMessages([
                                {
                                    type: "text",
                                    text: "ทำการบันทึกข้อมูลของ " + frmname + " เสร็จสิ้น",
                                },
                            ])
                                .then(() => {
                                    console.log("message sent");
                                })
                                .catch((err) => {
                                    console.log("error", err);
                                });

                            Swal.fire({
                                title: "Success",
                                text: "ดำเนินการเสร็จสิ้น",
                                icon: "success"
                            }).then(() => {
                                loadingModal.hide();
                                document.getElementById('regfrm').style.display = "none";
                                document.getElementById('regdetail').style.display = "block";
                                document.getElementById('regname').innerHTML = frmname;
                                document.getElementById('regtel').innerHTML = frmtel;
                            });
                        } else {
                            Swal.fire({
                                title: "Error",
                                text: "ดำเนินการผิดพลาด กรุณาลองใหม่อีกครั้ง",
                                icon: "error"
                            }).then(() => {
                                loadingModal.hide();
                            });
                        }
                    })
                    .catch((error) => {
                        Swal.fire({
                            title: "Error",
                            text: "ดำเนินการผิดพลาด กรุณาลองใหม่อีกครั้ง",
                            icon: "error"
                        }).then(() => {
                            loadingModal.hide();
                        });
                        console.log(error);
                    });

            }
        }

        loadingModal.show();
        
        liff.init({ liffId: "2009105579-dSU1MOzq" }, () => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    userId = profile.userId;
                    getreg();
                }).catch(err => {
                    Swal.fire({
                        title: "Error",
                        text: "การการเชื่อมต่อข้อมูลผิดพลาด กรุณาลองใหม่อีกครั้ง",
                        icon: "error"
                    }).then(() => {
                        liff.closeWindow();
                    });
                    console.error(err);
                });
            } else {
                liff.login();
            }
        }, err => {
            Swal.fire({
                title: "Error",
                text: "การการเชื่อมต่อข้อมูลผิดพลาด กรุณาลองใหม่อีกครั้ง",
                icon: "error"
            }).then(() => {
                liff.closeWindow();
            });
            console.error(err.code, error.message);
        });
    </script>
</body>

</html>
